<body>

  <div class="top-controls">
    <button id="toggle-dark-mode" aria-label="Toggle Dark Mode">
      <i class="bi bi-moon" aria-hidden="true"></i>
    </button>
    <button id="toggle-fullscreen" aria-label="Toggle Fullscreen">
      <i class="bi bi-arrows-fullscreen" aria-hidden="true"></i>
    </button>
  </div>

  <main class="container">
    <div id="progress-bar-container">
      <div id="progress-bar"></div>
    </div>
    <header id="info">
      <h1 id="site-title" title="Click to copy website link" style="cursor: pointer;">New Contemporary Photography</h1>
      <h2 class="content homage">
        This website was developed in homage to the great photographic works of <a
          href="https://www.flickr.com/groups/newcontemporaryphotography/" target="_blank"
          rel="noopener noreferrer">this group</a> and to all I have learned thanks to them during my years on Flickr.
      </h2>
      <div id="photo-info" class="content"></div>

      <!-- Skeleton Loader -->
      <div class="skeleton-loader">
        <div class="skeleton skeleton-text"></div>
        <div class="skeleton skeleton-text"></div>
        <div class="skeleton skeleton-image"></div>
      </div>
    </header>
    <div class="main-controls">
      <button id="load-photo">Next Photo <i class="bi bi-shuffle" aria-hidden="true"></i></button>
      <button id="toggle-autoplay" title="Toggle Auto-play">
        <i class="bi bi-play-fill" aria-hidden="true"></i> Auto-play
      </button>
    </div>
    <p class="keyboard-hint">or press <code>Space</code> / <code>Enter</code></p>
  </main>
  <footer class="portfolio-link">
    <p>
      Website by <a href="https://mendiak.github.io/portfolio/" target="_blank" rel="noopener noreferrer">Mikel
        Aramendia</a> |

        on GitHub</a>

    </div>
  </footer>
