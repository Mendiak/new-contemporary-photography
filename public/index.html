<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="color-scheme" content="light dark">

  <!-- Primary Meta Tags -->

  <meta name="description"
    content="Discover stunning photography from the New Contemporary Photography Flickr group. Browse beautiful images and immerse yourself in modern photography trends.">

  <!-- Open Graph / Facebook -->

    content="Discover stunning photography from the New Contemporary Photography Flickr group.">
  <meta property="og:image" content="https://new-contemporary-photography.vercel.app/assets/screenshot.jpg">
  <meta property="og:url" content="https://new-contemporary-photography.vercel.app/">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="New Contemporary Photography - A Flickr Photography Group">
  <meta name="twitter:description"
    content="Discover stunning photography from the New Contemporary Photography Flickr group.">
  <meta name="twitter:image" content="https://new-contemporary-photography.vercel.app/assets/screenshot.jpg">

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">

    "@context": "https://schema.org",

    "name": "New Contemporary Photography",
    "description": "A website showcasing photographs from the New Contemporary Photography Flickr group."
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/x-icon" href="/favicon.png">
  <meta name="google-site-verification" content="YQRsFuAu9kLLD9W473-R49ZQyvsYI7rhe6cfmgxsOvs" />
</head>

<body class="viewer-page">

  <main class="viewer" id="viewer">
    <section class="stage" aria-label="Photo viewer">
      <!-- Loading placeholder -->
      <div class="skeleton-loader stage-skeleton" aria-hidden="true">
        <div class="skeleton skeleton-image"></div>
      </div>

      <div id="photo-stage" class="photo-stage"></div>
      <div id="viewer-error" class="viewer-error" role="alert" hidden></div>
    </section>

    <header id="info" class="info">
      <div class="info-head">
        <h1 id="site-title">
          <button type="button" class="title-button" title="Copy the website link">New Contemporary
            Photography</button>
        </h1>

        <div class="viewer-tools">
          <button id="toggle-dark-mode" class="tool-button" type="button" aria-label="Switch to dark theme"
            aria-pressed="false">Dark</button>
          <button id="toggle-fullscreen" class="tool-button" type="button" aria-label="Enter fullscreen">Fullscreen</button>
        </div>
      </div>

      <p class="homage">
        This website was developed in homage to the great photographic works of <a
          href="https://www.flickr.com/groups/newcontemporaryphotography/" target="_blank"
          rel="noopener noreferrer">this group</a>, which I help administer, and to all I have learned thanks to them
        during my years on Flickr.
      </p>

      <div id="photo-info" class="content" aria-live="polite"></div>

      <!-- Loading placeholder -->
      <div class="skeleton-loader sidebar-skeleton" aria-hidden="true">
        <div class="skeleton skeleton-text"></div>
        <div class="skeleton skeleton-text"></div>
        <div class="skeleton skeleton-text short"></div>
      </div>
    </header>

    <div class="controls-panel">
      <div class="main-controls">
        <button id="load-photo" class="button-primary" type="button">Next photo</button>
        <button id="toggle-autoplay" type="button" aria-pressed="false">
          <span id="autoplay-label">Auto-play</span>
        </button>
      </div>
      <p class="keyboard-hint">Press <kbd>Space</kbd> or <kbd>Enter</kbd> to advance</p>
    </div>
  </main>

  <footer class="site-footer">
    <p>
      Website by <a href="https://mendiak.github.io/portfolio/" target="_blank" rel="noopener noreferrer">Mikel
        Aramendia</a> ·
      <a href="https://www.flickr.com/photos/mikelaramendia/" target="_blank" rel="noopener noreferrer">Flickr</a> ·
      <a href="/archive/">Archive</a> ·
      <a href="/about/">About</a> ·
      <a href="https://github.com/Mendiak/new-contemporary-photography" target="_blank" rel="noopener noreferrer">GitHub</a>
      ·
      <a href="https://www.buymeacoffee.com/Mendiak" target="_blank" rel="noopener noreferrer">Buy me a coffee</a>
    </p>
  </footer>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>

</html>
